apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
      - name: processing-service
        image: processing-service:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: JOB_SERVICE_URL
          value: "http://job-service:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service-high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-service-high
  template:
    metadata:
      labels:
        app: processing-service-high
    spec:
      containers:
      - name: processing-service-high
        image: processing-service:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: JOB_SERVICE_URL
          value: "http://job-service:8000"
        - name: QUEUE_HIGH
          value: "queue:high"
        - name: QUEUE_DEFAULT
          value: "queue:high"
        - name: QUEUE_LOW
          value: "queue:high"
