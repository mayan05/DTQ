services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  job-service:
    build: ./services/job_service
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  processing-service:
    build: ./services/processing_service
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOB_SERVICE_URL=http://job-service:8000
    depends_on:
      job-service:
        condition: service_started
      redis:
        condition: service_healthy

  # Dedicated high-priority worker 
  processing-service-high:
    build: ./services/processing_service
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOB_SERVICE_URL=http://job-service:8000
      # Override queues to ONLY listen to high priority
      - QUEUE_HIGH=queue:high
      - QUEUE_DEFAULT=queue:high
      - QUEUE_LOW=queue:high
    depends_on:
      job-service:
        condition: service_started
      redis:
        condition: service_healthy